[project]
name = "das"
version = "0.1.0"
description = "Detecting moving objects in DAS recordings (Jana Pawla II street)"
readme = "README.md"
requires-python = ">=3.12"
# Allowed image-processing stack only (see project requirements)
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "scikit-image>=0.22",
]

[dependency-groups]
# Tooling only - not part of the algorithm
dev = [
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
